<!doctype html>
<html lang="fr">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172631">
 <meta name="description" content="Pilotez votre restaurant de burgers : clients, cuisine, ingrédients, équipes, salle et finances.">
 <title>Flux Burger — Restaurant</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Flux Burger">
 <link rel="stylesheet" href="./warehouse.css"><link rel="icon" href="./icon-180.png">
</head>
<body>
 <main class="warehouse-world"><canvas id="warehouse-map" tabindex="0" aria-label="Restaurant en 3D : cuisine, comptoir, bornes, salle et clients."></canvas></main>
 <header class="topbar surface"><div class="brand"><span class="brand-icon" aria-hidden="true">F<span>↗</span></span><div><h1>FLUX<span class="version">1.3.1</span></h1><p>Burger · restaurant</p></div></div><div class="clock"><span id="day-label">JOUR 01</span><strong id="clock">06:00</strong><span id="shift-label">Mise en place</span></div><div class="speeds" aria-label="Vitesse du jeu"><button data-speed="0" aria-label="Pause">Ⅱ</button><button data-speed="1">×1</button><button data-speed="5">×5</button><button data-speed="10">×10</button><button data-speed="100">×100</button></div><button id="intake-toggle" class="subtle">Fermer les portes</button></header>
 <section class="metrics surface" aria-label="Indicateurs"><button data-open="finance"><span>Trésorerie</span><strong id="money">25 000 €</strong></button><button data-open="room" title="Groupes servis aujourd’hui"><span>Clients servis</span><strong id="active-count">0</strong></button><button data-open="room" title="Groupes dans la file d’attente"><span>File d’attente</span><strong id="delivered-count">0</strong></button><button data-open="kitchen" title="Commandes non servies au-delà de 8 minutes"><span>⚠ En retard</span><strong id="late-count">0</strong></button><button data-open="finance"><span>Résultat estimé</span><strong id="profit">0 €</strong></button><button data-open="stats" title="SLA : part des commandes servies en moins de 8 minutes sur les dernières 24 h de jeu"><span>SLA 8 min</span><strong id="sla" class="grade">—</strong></button></section>
 <section id="stock-gauges" class="stock-gauges surface" aria-label="Niveaux de stock"></section>
 <aside class="flow surface" aria-label="Service en direct"><div class="flow-head"><span class="eyebrow">SERVICE EN DIRECT</span><span id="flow-load">En attente</span></div><div class="flow-stages"><button data-open="room"><strong id="flow-queue">0</strong><span>🧍 File</span></button><i>›</i><button data-open="room"><strong id="flow-picking">0</strong><span>🧾 Caisse</span></button><i>›</i><button data-open="kitchen"><strong id="flow-packing">0</strong><span>🔥 Cuisine</span></button><i>›</i><button data-open="kitchen"><strong id="flow-ready">0</strong><span>✅ Prêtes</span></button><i>›</i><button data-open="room"><strong id="flow-road">0</strong><span>🍽 En salle</span></button></div><p id="operation-alert" hidden></p><button id="advice" class="advice" hidden></button></aside>
 <nav class="world-tools surface" aria-label="Pilotage"><button data-open="orders"><b aria-hidden="true">🧾</b><span>Ventes</span></button><button data-open="kitchen"><b aria-hidden="true">🔥</b><span>Cuisine</span></button><button data-open="room"><b aria-hidden="true">🍽</b><span>Salle</span></button><button data-open="stock"><b aria-hidden="true">🥬</b><span>Stock</span></button><button data-open="inbound"><b aria-hidden="true">🚚</b><span>Livraisons</span></button><button data-open="team"><b aria-hidden="true">👥</b><span>Équipes</span></button><button data-open="finance"><b aria-hidden="true">€</b><span>Finances</span></button><button data-open="stats"><b aria-hidden="true">📈</b><span>Stats</span></button><button id="save-toggle" aria-controls="save-dialog" hidden><b aria-hidden="true">▧</b><span id="save-mode-label">Partie</span></button></nav>
 <aside id="management-panel" class="management surface" hidden><div class="panel-head"><div><span class="eyebrow" id="panel-eyebrow">RESTAURANT</span><h2 id="panel-heading">Commandes</h2></div><button id="panel-close" class="icon" aria-label="Fermer">×</button></div><div id="management-content"></div></aside>
 <aside id="order-rail" class="order-rail surface" aria-label="Commandes en cuisine" hidden></aside>
 <aside id="opportunity" class="opportunity surface" hidden></aside>
 <footer class="world-footer"><span class="surface" id="world-status">Caisse · cuisine · salle</span><span class="footer-actions"><button id="sound-toggle" class="surface">🔔 Son</button><button id="reset-camera" class="surface">Recentrer la vue</button></span></footer>
 <div id="order-pop" class="order-pop" aria-live="polite"></div>
 <div id="notice" class="notice" hidden role="status"></div>
 <dialog id="save-dialog" aria-labelledby="save-title"><div class="save-heading"><div><span class="eyebrow">VOTRE RESTAURANT</span><h2 id="save-title">Partie & sauvegarde</h2></div><button id="save-close" class="icon" aria-label="Fermer">×</button></div><p id="save-status" aria-live="polite">Chargement de la partie…</p><p id="offline-status" aria-live="polite"></p><div class="save-actions"><button id="save-flight" class="primary">Préparer pour l’avion</button><button id="save-now">Sauvegarder maintenant</button><button id="save-reload">Recharger la sauvegarde</button><button id="save-local" hidden>Garder la partie de cet appareil</button><button id="save-recovery" hidden>Reprendre la copie de récupération</button><button id="save-previous">Reprendre la version précédente</button><button id="save-export">Exporter la partie</button><button id="save-new">Nouveau restaurant</button></div><p id="migration-info" hidden></p><div id="save-confirm" hidden><p>Recommencer avec un nouveau restaurant ?</p><button id="save-confirm-new">Oui, recommencer</button><button id="save-cancel-new">Annuler</button></div><button id="save-return" class="primary full">Retour aux opérations</button></dialog>
 <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module" src="./game.js"></script>
</body>
</html>
