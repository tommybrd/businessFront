<!doctype html>
<html lang="fr">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#9fd46a">
 <title>Flux Arcade — alpha</title><link rel="icon" href="./icon-180.png">
 <style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd46a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hud{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 24px);gap:8px;z-index:2}
  .chip{background:#ffffffe8;color:#26343f;border-radius:14px;padding:7px 13px;font-weight:900;font-size:20px;box-shadow:0 3px 0 #0002}
  .wait{min-width:96px}.gauge{height:7px;border-radius:4px;background:#e3e8eb;margin-top:4px;overflow:hidden}.gauge i{display:block;height:100%;width:0;border-radius:4px;background:#4fbf5a;transition:width .3s,background .3s}
  .chip small{display:block;font-size:10px;font-weight:700;color:#6b7a84}
  .brand{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:2;background:#ffffffe8;color:#26343f;border-radius:14px;padding:7px 12px;font-weight:900;letter-spacing:1px;box-shadow:0 3px 0 #0002}.brand small{display:block;font-size:10px;letter-spacing:0;color:#6b7a84}
  #hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#26343fdd;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;max-width:min(92vw,560px);text-align:center;z-index:2;pointer-events:none}
  #reset{position:fixed;left:12px;bottom:max(18px,env(safe-area-inset-bottom));z-index:3;border:0;border-radius:12px;background:#ffffffd0;padding:8px 10px;font:inherit;font-size:12px;font-weight:700;color:#26343f;cursor:pointer}
  #team{position:fixed;right:12px;bottom:max(18px,env(safe-area-inset-bottom));z-index:3;border:0;border-radius:12px;background:#ffffffe8;padding:9px 13px;font:inherit;font-size:14px;font-weight:800;color:#26343f;cursor:pointer;box-shadow:0 3px 0 #0002}
  #teampanel{position:fixed;right:12px;bottom:max(64px,calc(env(safe-area-inset-bottom) + 64px));z-index:5;width:min(360px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;background:#fffffff5;color:#26343f;border-radius:16px;box-shadow:0 8px 30px #0003;padding:14px;box-sizing:border-box}
  #teampanel header{display:flex;justify-content:space-between;align-items:center;font-size:16px}#teampanel header button{border:0;background:#eef2f4;border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer}
  #teampanel p{margin:6px 0 10px;font-size:12.5px;color:#5b6a73}
  .worker{display:grid;grid-template-columns:32px 1fr;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid #e3e8eb}.worker .ico{grid-row:span 2;font-size:22px;text-align:center}.worker b{font-size:14px}.worker small{color:#6b7a84;font-weight:700}
  .worker select{grid-column:2;width:100%;font:inherit;font-size:14px;padding:6px 8px;border-radius:9px;border:1.5px solid #d3dbe0;background:#fff;color:#26343f}
  #team:focus-visible,#teampanel select:focus-visible,#teampanel button:focus-visible{outline:3px solid #e8483a;outline-offset:2px}
  #stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#ffffff40;border:3px solid #ffffff90;z-index:4;pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:#ffffffd8;transform:translate(-50%,-50%)}
  @media(max-width:600px){.hud{top:max(64px,calc(env(safe-area-inset-top) + 52px));gap:6px}.chip{font-size:16px;padding:5px 9px}#hint{font-size:13px;bottom:62px;max-width:calc(100vw - 24px)}}
 </style>
</head>
<body>
 <canvas id="arcade" aria-label="Jeu : déplacez le personnage avec ZQSD, les flèches ou en glissant le doigt."></canvas>
 <div class="brand">FLUX ARCADE<small>alpha · ZQSD / flèches / doigt</small></div>
 <div class="hud"><div class="chip" title="Argent sur le compte (cartes bancaires comprises) et espèces encore dans les caisses"><small>Compte · 💵 <b id="cashwait">0 $</b> en caisse</small><span id="money">0 $</span></div><div class="chip"><small>Servis</small><span id="served">0</span></div><div class="chip wait" title="Temps d’attente moyen des clients : au-delà de la patience, ils partent fâchés"><small>Attente moy. · <b id="lost">0 partis</b></small><span id="wait">0 s</span><div class="gauge"><i id="gauge"></i></div></div><div class="chip" title="Affluence : publicité × réputation × rush"><small>Affluence · <b id="rep">★ 2.5</b></small><span id="traffic">×1.0</span></div></div>
 <div id="hint" hidden></div><button id="reset">↺ Recommencer</button>
 <button id="team" hidden>👷 Équipe</button>
 <section id="teampanel" hidden aria-label="Missions de l’équipe"><header><b>Missions de l’équipe</b><button id="teamclose" aria-label="Fermer">✕</button></header><p>Choisissez la tâche de chaque employé et robot. Les robots ne font qu’un trajet ; les employés peuvent tenir une chaîne entière.</p><div id="teamlist"></div></section>
 <div id="stick" hidden><div id="knob"></div></div>
 <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module" src="./arcade.js"></script>
</body>
</html>
